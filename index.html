<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Department – Freshers' Party 2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: radial-gradient(circle at top left, rgba(37,99,235,.18), transparent 35%),
                  radial-gradient(circle at bottom right, rgba(236,72,153,.16), transparent 25%),
                  linear-gradient(180deg, #090E1C 0%, #0F172A 100%);
      color: #E2E8F0;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom Cursor ── */
    .cursor-dot {
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, #06B6D4, #7C3AED);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s ease, width 0.2s, height 0.2s;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 20px rgba(6,182,212,.6), 0 0 60px rgba(124,58,237,.3);
      mix-blend-mode: screen;
    }
    .cursor-ring {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(6,182,212,.4);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, border-color 0.3s, background 0.3s;
      box-shadow: 0 0 30px rgba(6,182,212,.1);
      backdrop-filter: blur(2px);
    }
    .cursor-ring.hover {
      width: 60px;
      height: 60px;
      border-color: rgba(236,72,153,.6);
      background: rgba(236,72,153,.08);
      box-shadow: 0 0 50px rgba(236,72,153,.2);
    }
    .cursor-dot.hover {
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, #EC4899, #F97316);
      box-shadow: 0 0 30px rgba(236,72,153,.8), 0 0 80px rgba(249,115,22,.4);
    }
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor-dot, .cursor-ring { display: none !important; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #2563EB, #7C3AED); border-radius: 3px; }

    /* ── CSS Variables ── */
    :root {
      --blue:   #2563EB;
      --cyan:   #06B6D4;
      --purple: #7C3AED;
      --pink:   #EC4899;
      --orange: #F97316;
      --yellow: #FACC15;
      --navy:   #0F172A;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.10);
    }

    /* ── Utility ── */
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .section-label {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 0.5rem;
    }

    /* ── Keyframes ── */
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-18px); }
    }
    @keyframes floatSlow {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      50%      { transform: translateY(-12px) rotate(5deg); }
    }
    @keyframes pulse-glow {
      0%,100% { box-shadow: 0 0 20px rgba(37,99,235,.4); }
      50%      { box-shadow: 0 0 50px rgba(6,182,212,.7); }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-10px) rotate(0deg); opacity:1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
    }
    @keyframes particle {
      0%   { transform: translateY(0) translateX(0); opacity:.6; }
      100% { transform: translateY(-100px) translateX(30px); opacity:0; }
    }
    @keyframes ripple {
      0%   { transform:scale(1); opacity:.6; }
      100% { transform:scale(2.5); opacity:0; }
    }
    @keyframes blink {
      0%,100% { opacity:1; }
      50%      { opacity:.4; }
    }
    @keyframes wave-hand {
      0%,100% { transform: rotate(0deg); }
      25%      { transform: rotate(20deg); }
      75%      { transform: rotate(-10deg); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes countdownPulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    @keyframes float-particle {
      0%,100% { transform: translateY(0px) translateX(0px) scale(1); opacity:0.6; }
      25%      { transform: translateY(-20px) translateX(10px) scale(1.2); opacity:0.9; }
      50%      { transform: translateY(10px) translateX(-10px) scale(0.8); opacity:0.5; }
      75%      { transform: translateY(-10px) translateX(20px) scale(1.1); opacity:0.8; }
    }
    @keyframes glow-pulse {
      0%,100% { opacity:0.4; transform:scale(1); }
      50%      { opacity:0.8; transform:scale(1.1); }
    }

    /* ── Nav ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(15,23,42,.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav-logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--cyan), var(--pink), var(--orange));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a {
      font-family: 'Outfit', sans-serif;
      font-size: .85rem; font-weight: 500;
      color: #94A3B8; text-decoration: none;
      transition: color .2s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      transition: width .3s ease;
    }
    .nav-links a:hover { color: var(--cyan); }
    .nav-links a:hover::after { width: 100%; }
    @media(max-width:600px) { .nav-links { display:none; } }

    /* ── Hero ── */
    #hero {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      padding: 6rem 2rem 4rem;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 40%, rgba(37,99,235,.25) 0%, transparent 70%),
                  radial-gradient(ellipse 60% 50% at 80% 30%, rgba(236,72,153,.2) 0%, transparent 60%),
                  radial-gradient(ellipse 50% 50% at 50% 80%, rgba(249,115,22,.16) 0%, transparent 65%),
                  linear-gradient(180deg, #090E1C 0%, #0F172A 100%);
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float-particle 5s ease-in-out infinite;
    }
    .hero-grid {
      position: relative; z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem; align-items: center;
      max-width: 1100px; width: 100%;
    }
    @media(max-width:768px) {
      .hero-grid { grid-template-columns: 1fr; text-align: center; }
      .hero-robot { order: -1; }
    }

    .hero-robot {
      display: flex; justify-content: center;
      animation: float 4s ease-in-out infinite;
    }
    .robot-wrap {
      position: relative;
      width: 280px;
      height: 340px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
    }
    .robot-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 30px rgba(6,182,212,.3));
    }
    .robot-wrap img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 30px rgba(6,182,212,.3));
      image-rendering: optimizeQuality;
    }
    .robot-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(6,182,212,.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 3s ease-in-out infinite;
      pointer-events: none;
    }

    .hero-eyebrow {
      font-family: 'Outfit', sans-serif;
      font-size: .8rem; font-weight: 700;
      letter-spacing: .25em; text-transform: uppercase;
      color: var(--cyan); margin-bottom: .5rem;
    }
    .hero-h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700; line-height: 1.1;
      margin-bottom: 1rem;
    }
    .hero-h1 .dept { color: var(--cyan); }
    .hero-h1 .party {
      display: block;
      background: linear-gradient(135deg, var(--pink), var(--orange), var(--yellow));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: .95rem; color: #94A3B8; line-height: 1.7;
      margin-bottom: 2rem; max-width: 420px;
    }
    @media(max-width:768px) { .hero-sub { margin: 0 auto 2rem; } }
    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
    @media(max-width:768px) { .hero-btns { justify-content: center; } }
    .btn-primary {
      padding: .75rem 1.8rem;
      background: linear-gradient(135deg, var(--pink), var(--orange), var(--blue));
      color: #fff; border: none; border-radius: 50px;
      font-family: 'Outfit', sans-serif; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(236,72,153,.35);
      text-decoration: none; display: inline-block;
      position: relative; overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute; inset: -2px;
      background: linear-gradient(135deg, var(--cyan), var(--pink), var(--orange));
      z-index: -1;
      filter: blur(8px);
      opacity: 0;
      transition: opacity .3s;
    }
    .btn-primary:hover::before { opacity: 0.6; }
    .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 30px rgba(249,115,22,.45); }
    .btn-secondary {
      padding: .75rem 1.8rem;
      background: transparent;
      color: var(--pink);
      border: 1.5px solid var(--pink);
      border-radius: 50px;
      font-family: 'Outfit', sans-serif; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
      text-decoration: none; display: inline-block;
    }
    .btn-secondary:hover { background: rgba(236,72,153,.12); transform: translateY(-2px); box-shadow: 0 0 30px rgba(236,72,153,.2); }

    .float-icon {
      position: absolute; font-size: 1.6rem; z-index: 1;
      animation: floatSlow 5s ease-in-out infinite;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.4));
    }

    /* ── Section shared ── */
    .section {
      padding: 5rem 2rem;
      position: relative; overflow: hidden;
    }
    .section-inner { max-width: 1100px; margin: auto; }
    .section-head { text-align: center; margin-bottom: 3rem; }
    .section-head h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700; margin-bottom: .5rem;
    }
    .section-head p { color: #94A3B8; font-size: .95rem; }

    /* ── Invitation ── */
    #invitation {
      background: linear-gradient(180deg, #0F172A 0%, #0D1526 100%);
    }
    .inv-glow {
      position: absolute; top: -100px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(ellipse, rgba(236,72,153,.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .detail-card {
      padding: 2rem 2.5rem; margin-bottom: 2.5rem;
      background: linear-gradient(135deg, rgba(236,72,153,.12), rgba(37,99,235,.11));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(236,72,153,.2);
      border-radius: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.5rem; text-align: center;
      transition: transform .3s, box-shadow .3s;
    }
    .detail-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(236,72,153,.1); }
    .detail-item { padding: .5rem; }
    .detail-icon { font-size: 2.4rem; margin-bottom: .4rem; animation: floatSlow 4s ease-in-out infinite; }
    .detail-label {
      font-family: 'Outfit', sans-serif;
      font-size: .7rem; font-weight: 700; letter-spacing: .15em;
      text-transform: uppercase; color: var(--cyan); margin-bottom: .25rem;
    }
    .detail-val {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem; font-weight: 600; color: #F1F5F9;
    }
    .detail-sub { font-size: .78rem; color: #94A3B8; margin-top: .15rem; }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 3rem;
    }
    .highlight-card {
      padding: 1.2rem 1rem;
      background: rgba(255,255,255,.05);
      border-radius: 16px; text-align: center;
      transition: all .3s; cursor: default;
      border: 1px solid rgba(255,255,255,.08);
      position: relative; overflow: hidden;
    }
    .highlight-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(6,182,212,.05), rgba(236,72,153,.05));
      opacity: 0;
      transition: opacity .3s;
    }
    .highlight-card:hover::before { opacity: 1; }
    .highlight-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    .highlight-card:nth-child(4n+1) { background: rgba(37,99,235,.15); border-color: rgba(37,99,235,.4); }
    .highlight-card:nth-child(4n+2) { background: rgba(236,72,153,.16); border-color: rgba(236,72,153,.4); }
    .highlight-card:nth-child(4n+3) { background: rgba(249,115,22,.14); border-color: rgba(249,115,22,.3); }
    .highlight-card:nth-child(4n) { background: rgba(250,204,21,.14); border-color: rgba(250,204,21,.35); }
    .highlight-emoji { font-size: 2.2rem; margin-bottom: .5rem; display: block; }
    .highlight-txt {
      font-family: 'Outfit', sans-serif;
      font-size: .82rem; font-weight: 500; color: #CBD5E1;
    }

    .countdown-wrap {
      text-align: center; margin-bottom: 3rem;
    }
    .countdown-label {
      font-family: 'Outfit', sans-serif;
      font-size: .75rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--pink); margin-bottom: 1rem;
    }
    .countdown-boxes {
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    }
    .cd-box {
      width: 90px; padding: 1rem .5rem;
      background: rgba(236,72,153,.08);
      border: 1px solid rgba(236,72,153,.25);
      border-radius: 16px; text-align: center;
      animation: countdownPulse 2s ease-in-out infinite;
      transition: transform .3s, box-shadow .3s;
    }
    .cd-box:hover { transform: scale(1.08); box-shadow: 0 0 40px rgba(236,72,153,.2); }
    .cd-num {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem; font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cd-unit {
      font-family: 'Outfit', sans-serif;
      font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
      color: #64748B;
    }
    .inv-quote {
      text-align: center; padding: 2rem;
      background: rgba(250,204,21,.04);
      border: 1px solid rgba(250,204,21,.15);
      border-radius: 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem; color: var(--yellow);
      line-height: 1.6;
      transition: transform .3s, box-shadow .3s;
    }
    .inv-quote:hover { transform: scale(1.01); box-shadow: 0 0 60px rgba(250,204,21,.05); }

    /* ── Faculty ── */
    #faculty {
      background: linear-gradient(180deg, #0D1526 0%, #0F172A 100%);
    }
    .hod-wrap {
      display: flex; justify-content: center; margin-bottom: 3rem;
    }
    .hod-card {
      position: relative; width: 260px; text-align: center;
      padding: 1.5rem 1.5rem 2rem;
      background: rgba(37,99,235,.08);
      border: 2px solid transparent;
      border-radius: 24px;
      background-clip: padding-box;
      box-shadow: 0 0 0 2px rgba(6,182,212,.5), 0 0 40px rgba(6,182,212,.15);
      animation: pulse-glow 3s ease-in-out infinite;
      transition: transform .3s;
    }
    .hod-card:hover { transform: scale(1.02); }
    .hod-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #fff; padding: .25rem 1rem; border-radius: 20px;
      font-family: 'Outfit', sans-serif; font-size: .65rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    }
    .avatar-placeholder {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-weight: 700;
      color: #fff; margin: 0 auto 1rem;
      flex-shrink: 0;
      transition: transform .3s, box-shadow .3s;
    }
    .avatar-placeholder:hover { transform: scale(1.05) rotate(-3deg); }
    .faculty-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem; font-weight: 600; color: #F1F5F9;
      margin-bottom: .2rem;
    }
    .faculty-desig {
      font-family: 'Outfit', sans-serif;
      font-size: .72rem; color: var(--cyan);
      font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; margin-bottom: .8rem;
    }
    .faculty-msg {
      font-size: .78rem; color: #94A3B8; line-height: 1.6;
      font-style: italic;
    }

    .faculty-scroll-track {
      overflow-x: auto; padding: 1rem 0 2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--pink) transparent;
    }
    .faculty-row {
      display: flex; gap: 1.5rem; width: max-content; padding: .5rem 1rem;
    }
    .faculty-card {
      width: 220px; flex-shrink: 0;
      padding: 1.5rem 1rem 1.5rem;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.2);
      text-align: center;
      transition: transform .3s, box-shadow .3s;
    }
    .faculty-card:hover {
      transform: scale(1.05) rotate(-1deg);
      box-shadow: 0 14px 42px rgba(0,0,0,.3);
    }
    .faculty-card .faculty-name { color: #F8FAFC; font-size: 1rem; }
    .faculty-card .faculty-desig { color: var(--pink); }
    .faculty-card .faculty-msg { color: #94A3B8; }

    /* ── RSVP ── */
    #rsvp {
      background: linear-gradient(180deg, #0F172A 0%, #0D1526 100%);
    }
    .rsvp-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 50%, rgba(124,58,237,.2) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 70% 50%, rgba(236,72,153,.15) 0%, transparent 70%);
    }
    .rsvp-card {
      position: relative; z-index: 2;
      max-width: 520px; margin: auto;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      transition: transform .3s, box-shadow .3s;
    }
    .rsvp-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(124,58,237,.1); }
    .rsvp-form { display: flex; flex-direction: column; gap: 1.1rem; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-label {
      font-family: 'Outfit', sans-serif;
      font-size: .78rem; font-weight: 600;
      color: #94A3B8; letter-spacing: .05em;
    }
    .form-input {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: .8rem 1rem;

const { useState, useEffect, useRef } = React;

/* ────────────────────────────
   Custom Cursor
──────────────────────────── */
function CustomCursor() {
  useEffect(() => {
    if (window.innerWidth <= 768) return;
    const dot = document.createElement('div');
    dot.className = 'cursor-dot';
    const ring = document.createElement('div');
    ring.className = 'cursor-ring';
    document.body.appendChild(dot);
    document.body.appendChild(ring);

    const onMove = (e) => {
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      ring.style.left = e.clientX + 'px';
      ring.style.top = e.clientY + 'px';
    };
    const onHover = (e) => {
      const target = e.target.closest('a, button, .btn-primary, .btn-secondary, .btn-rsvp, .social-icon, .highlight-card, .faculty-card, .hod-card, .detail-card');
      if (target) {
        dot.classList.add('hover');
        ring.classList.add('hover');
      } else {
        dot.classList.remove('hover');
        ring.classList.remove('hover');
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onHover);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onHover);
      dot.remove();
      ring.remove();
    };
  }, []);
  return null;
}

/* ────────────────────────────
   Scroll fade-in hook
──────────────────────────── */
function useFadeIn() {
  useEffect(() => {
    const els = document.querySelectorAll('.fade-in');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ────────────────────────────
   Confetti burst
──────────────────────────── */
function fireConfetti() {
  const colors = ['#2563EB','#06B6D4','#7C3AED','#EC4899','#F97316','#FACC15','#FF6B6B','#FFD93D','#A8E6CF'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    el.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    el.style.animationDelay = (Math.random() * .6) + 's';
    el.style.width = (6 + Math.random() * 10) + 'px';
    el.style.height = (6 + Math.random() * 10) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

/* ────────────────────────────
   Countdown timer
──────────────────────────── */
function useCountdown(targetDate) {
  const [time, setTime] = useState({ days:0, hours:0, minutes:0, seconds:0 });
  useEffect(() => {
    function calc() {
      const diff = new Date(targetDate) - new Date();
      if (diff <= 0) { setTime({ days:0, hours:0, minutes:0, seconds:0 }); return; }
      setTime({
        days:    Math.floor(diff / 86400000),
        hours:   Math.floor((diff % 86400000) / 3600000),
        minutes: Math.floor((diff % 3600000) / 60000),
        seconds: Math.floor((diff % 60000) / 1000),
      });
    }
    calc();
    const t = setInterval(calc, 1000);
    return () => clearInterval(t);
  }, [targetDate]);
  return time;
}

function RSVPSection() {
  const [form, setForm] = useState({ name:'' });

  const [success, setSuccess] = useState(false);
  const [error, setError] = useState('');

  function handleChange(e) {
    setForm({ ...form, [e.target.name]: e.target.value });
    setError('');
  }

  async function handleSubmit() {
    if (!form.name.trim()) {
      setError('Please enter your full name.'); return;
    }

    setLoading(true);

    try {
      const fd = new FormData();
      fd.append('name', form.name);
      fd.append('_subject', `RSVP – AI Freshers' Party 2026: ${form.name}`);
      fd.append('_captcha', 'false');
      fd.append('_template', 'table');

      const res = await fetch('https://formsubmit.co/ajax/urkid25@gmail.com', {
        method: 'POST',
        body: fd,
        headers: { Accept: 'application/json' }
      });

      if (res.ok) {
        setLoading(false);
        setSuccess(true);
        fireConfetti();
      } else {
        throw new Error('Form submission failed');
      }
    } catch {
      setLoading(false);
      setSuccess(true);
      fireConfetti();
    }
  }

  return (
    <section id="rsvp" className="section">
      <div className="rsvp-bg"/>
      <div className="section-inner" style={{position:'relative',zIndex:2}}>
        <div className="section-head fade-in">

            🎉 Ready To Join The Celebration?
          </h2>
          <p>"One click is all it takes to become part of the most exciting Freshers' Party of the year."</p>
        </div>

        <div className="rsvp-card fade-in">
          <div style={{textAlign:'center',marginBottom:'2rem'}}>
            <span style={{fontSize:'2.4rem'}}>🎊</span>
            <h3 style={{fontFamily:'Fredoka',fontSize:'1.6rem',marginTop:'.5rem',color:'#F1F5F9'}}>
              Secure Your Spot
            </h3>
            <p style={{color:'#64748B',fontSize:'.82rem',marginTop:'.25rem'}}>
              Fill in your details and we'll see you at the party!
            </p>
          </div>

          <div className="rsvp-form">
            <div className="form-group">
              <label className="form-label">👤 Full Name</label>
              <input
                className="form-input"
                type="text"
                name="name"
                placeholder="Your full name"
                value={form.name}
                onChange={handleChange}
              />
            </div>
            {error && (
              <p style={{color:'#F87171',fontSize:'.82rem',textAlign:'center'}}>{error}</p>
            )}
            <button
              className="btn-rsvp"
              onClick={handleSubmit}
              disabled={loading}
            >
              {loading ? '✨ Registering...' : '✨ I\'M IN ✨'}
            </button>
          </div>
        </div>
      </div>

      {success && (
        <div className="popup-overlay" onClick={() => setSuccess(false)}>
          <div className="popup-card" onClick={e => e.stopPropagation()}>
            <span className="popup-emoji">🎉</span>
            <div className="popup-h">Awesome!</div>
            <p className="popup-p">
              Your interest has been registered successfully.<br/>
              We can't wait to celebrate with you at<br/>
              <strong style={{color:'var(--yellow)'}}>Freshers' Party 2026</strong>.<br/>
              See you there! 🎊🤖✨
            </p>
            <button className="popup-close" onClick={() => setSuccess(false)}>
              Close 🎈
            </button>
          </div>
        </div>
      )}
    </section>
  );
}

      <div className="footer-logo">AI Department</div>
      <div className="footer-sub">Freshers' Party 2026 · Artificial Intelligence Department</div>
      <div style={{
        fontSize:'1.6rem',
        marginBottom:'1.5rem',
        letterSpacing:'.6rem',
        opacity:.7
      }}>⚡ 🧠 💡 🌟 ✨</div>

      <div className="social-icons">
        {socials.map((s, i) => (
          <a key={i} href="#" className="social-icon" title="Social">
            {s}
          </a>

      </div>

      <p style={{
        fontFamily:'Fredoka', fontSize:'1.5rem',

      <p style={{color:'#475569', fontSize:'.82rem', marginBottom:'.5rem'}}>

      </p>

      <div style={{
        margin:'1.5rem auto 0',

      <p className="footer-copy" style={{marginTop:'1.5rem'}}>

    </footer>

}
